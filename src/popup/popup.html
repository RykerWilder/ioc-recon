<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>IOC Recon</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <span class="popup-icon">🔎</span>
      <span class="popup-title">Last analyzed IOCs</span>
    </div>
    <div id="history-list" class="history-list">
      <div class="empty-state">Loading</div>
    </div>
    <label class="popup-footer" for="auto-close-toggle">
      <span class="footer-text">
        <span class="footer-title">Auto-close result card</span>
        <span class="footer-sub">Hide it after 10s (Esc still work)</span>
      </span>
      <input type="checkbox" id="auto-close-toggle" class="switch-input" />
      <span class="switch" aria-hidden="true"></span>
    </label>
  </div>
  <script src="../shared/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
