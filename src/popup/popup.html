<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IOC Recon</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" class="logo__mark">
          <g fill="currentColor">
            <circle cx="4" cy="4" r="2.2" />
            <circle cx="12" cy="4" r="2.2" />
            <circle cx="20" cy="4" r="2.2" />
            <circle cx="4" cy="12" r="2.2" />
            <circle cx="20" cy="12" r="2.2" />
            <circle cx="4" cy="20" r="2.2" />
            <circle cx="12" cy="20" r="2.2" />
            <circle cx="20" cy="20" r="2.2" />
          </g>
          <circle cx="12" cy="12" r="3.4" fill="var(--accent)" />
        </svg>
        <span class="logo__text">IOC Recon</span>
      </span>
      <span class="popup-count mono" id="history-count"></span>
    </header>

    <h1 class="popup-title">Last analyzed IOCs</h1>

    <div id="history-list" class="history-list">
      <div class="empty-state">Loading…</div>
    </div>

    <div class="popup-footer">
      <span class="footer-hint mono" id="key-hint" hidden>AbuseIPDB key missing</span>
      <button type="button" class="settings-btn" id="open-settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.75"/>
          <rect x="14" y="4" width="4" height="6" stroke="currentColor" stroke-width="1.75"/>
          <rect x="6" y="14" width="4" height="6" stroke="currentColor" stroke-width="1.75"/>
        </svg>
        <span aria-hidden="true">[</span><span class="settings-btn__label">Settings</span><span aria-hidden="true">]</span>
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
